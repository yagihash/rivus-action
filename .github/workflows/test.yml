name: "Test Action"

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck
        run: shellcheck setup.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-26.04-arm
          - macos-latest
        version:
          - v0.0.14
          - latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # macOS runners do not ship Go. rivus pins its own Go version in go.mod and the go command fetches it.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable

      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2

      - name: Run action
        uses: ./
        with:
          version: ${{ matrix.version }}
          dart: true

      - name: Verify rivus is on PATH
        run: |
          rivus version
          command -v rivus-dart

      - name: Verify the Dart extractor runs
        run: |
          mkdir -p dart-project/lib
          printf 'name: demo\nenvironment:\n  sdk: ^3.8.0\n' > dart-project/pubspec.yaml
          printf 'import "dart:io";\nvoid main(List<String> a) {\n  Process.run("sh", ["-c", a.first]);\n}\n' > dart-project/lib/main.dart
          rivus sites -lang dart -C dart-project | grep 'dart:io#Process.run'
