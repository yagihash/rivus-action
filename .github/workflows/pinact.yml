name: "Run pinact"

on:
  pull_request:
    paths:
      - ".github/**"
      - "action.yml"
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - "action.yml"
  workflow_dispatch:

jobs:
  pinact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinact
        run: |
          # renovate: datasource=github-releases depName=suzuki-shunsuke/pinact
          version=v5.0.2
          gh release download -R suzuki-shunsuke/pinact "${version}" -p pinact_linux_amd64.tar.gz
          gh attestation verify pinact_linux_amd64.tar.gz \
            -R suzuki-shunsuke/pinact \
            --signer-workflow suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
          tar xzf pinact_linux_amd64.tar.gz pinact
        env:
          GH_TOKEN: ${{ github.token }}

      # Every `uses:` of the workflows and action.yml is pinned to a full commit SHA with a version comment.
      - name: Run pinact
        run: ./pinact run --check
        env:
          GITHUB_TOKEN: ${{ github.token }}
