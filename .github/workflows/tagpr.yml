name: tagpr

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: tagpr
  cancel-in-progress: false

jobs:
  # Create or update the release pull request. When it is merged, create the tag and the GitHub Release.
  # CHANGELOG.md is updated by tagpr inside the release pull request (`changelog = true` in .tagpr).
  #
  # Every run uses a ghmint token (.github/ghmint/tagpr.rego), not GITHUB_TOKEN:
  #   - a pull request made or updated with GITHUB_TOKEN does not start the CI, so the release pull request could not pass the required checks;
  #   - GITHUB_TOKEN cannot create the pull request unless the repository allows GitHub Actions to create pull requests.
  tagpr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # ghmint

    steps:
      - id: token
        uses: yagihash/ghmint-action@be57533eef7f69550d06f0c93eede5589158281a # v1.0.0
        with:
          scope: ${{ github.repository }}
          policy: tagpr

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false

      - uses: Songmu/tagpr@047aec4b6c0ce166f52958b5a97f5a3d927fd65b # v1.22.0
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
