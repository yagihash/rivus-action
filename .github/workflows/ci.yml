name: CI

# One workflow, and one check that a ruleset can require: `ci-ok` (the last job). It fails when any job above it failed or was cancelled.
# Jobs can be added or renamed without touching the ruleset; a job added here has to be added to the `needs` of `ci-ok`.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

# A pull request is checked per branch: a new push to it cancels the run in progress. A push to main keeps every run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which of the jobs that run the action have to run (`test`, `test-rust`). A pull request is judged by the files that it changes: the action itself
  # (action.yml, setup.sh) and this workflow. A push to main and a run by hand run everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter asks the API for the files of a pull request
    outputs:
      action: ${{ steps.filter.outputs.action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: gh auth setup-git
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          token: ${{ github.token }}
          filters: |
            action:
              - 'action.yml'
              - 'setup.sh'
              - '.github/workflows/ci.yml'

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck
        run: shellcheck setup.sh

  # Security checks of the workflows and action.yml (ghalint) and a lint of the workflows (actionlint).
  ghalint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read # gh attestation verify

    steps:
      - uses: cicd-sensor/cicd-sensor-action@6511eb44c91d71b2b93d71193b1bf2cb18352f66 # v0.0.38

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ghalint
        run: |
          # renovate: datasource=github-releases depName=suzuki-shunsuke/ghalint
          version=v1.5.6
          gh release download -R suzuki-shunsuke/ghalint "${version}" -p "ghalint_${version#v}_linux_amd64.tar.gz"
          gh attestation verify "ghalint_${version#v}_linux_amd64.tar.gz" \
            -R suzuki-shunsuke/ghalint \
            --signer-workflow suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
          tar xzf "ghalint_${version#v}_linux_amd64.tar.gz" ghalint
        env:
          GH_TOKEN: ${{ github.token }}

      # Run the two independent ghalint checks concurrently using the new
      # parallel steps feature (background steps + wait-all).
      # https://github.blog/changelog/2026-06-25-actions-steps-can-now-be-run-in-parallel/
      - name: Run ghalint run
        run: ./ghalint run
        background: true

      - name: Run ghalint act
        run: ./ghalint act
        background: true

      - wait-all:

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read # gh attestation verify

    steps:
      - uses: cicd-sensor/cicd-sensor-action@6511eb44c91d71b2b93d71193b1bf2cb18352f66 # v0.0.38

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          # renovate: datasource=github-releases depName=rhysd/actionlint
          version=v1.7.12
          gh release download -R rhysd/actionlint "${version}" -p "actionlint_${version#v}_linux_amd64.tar.gz"
          gh attestation verify "actionlint_${version#v}_linux_amd64.tar.gz" --repo rhysd/actionlint
          tar xzf "actionlint_${version#v}_linux_amd64.tar.gz" actionlint
        env:
          GH_TOKEN: ${{ github.token }}

      # actionlint does not know the parallel steps (background / wait-all) yet. The label of the arm64 runner is in .github/actionlint.yaml.
      - name: Run actionlint
        run: |
          ./actionlint \
            -ignore 'unexpected key "background"' \
            -ignore 'step must run script with "run" section or run action with "uses" section'

  test:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.action == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-26.04-arm
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read # gh attestation verify

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2

      # v0.0.14 and earlier have no binaries. The action must fail on them, not fall back to anything.
      - name: Install a release without binaries
        id: no-binaries
        uses: ./
        continue-on-error: true
        with:
          version: v0.0.14

      - name: Verify that it failed
        env:
          OUTCOME: ${{ steps.no-binaries.outcome }}
        run: test "$OUTCOME" = failure

      - name: Run action
        uses: ./
        with:
          dart: true

      - name: Verify rivus is on PATH
        run: |
          rivus version
          command -v rivus-dart

      - name: Verify the Dart extractor runs
        run: |
          mkdir -p dart-project/lib
          printf 'name: demo\nenvironment:\n  sdk: ^3.8.0\n' > dart-project/pubspec.yaml
          printf 'import "dart:io";\nvoid main(List<String> a) {\n  Process.run("sh", ["-c", a.first]);\n}\n' > dart-project/lib/main.dart
          rivus sites -lang dart -C dart-project | grep 'dart:io#Process.run'

  # The Rust extractor needs the pinned nightly (about 1.1 GB) and a build of the extractor, so this job is slow and runs only when the
  # action or this workflow changed (a pull request), and on every push to main. Nothing is cached.
  test-rust:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.action == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: read # gh attestation verify

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run action
        uses: ./
        with:
          rust: true

      - name: Verify the Rust extractor runs
        run: |
          cargo new --quiet --bin rust-project
          printf 'use std::process::Command;\nfn main() {\n    let a: Vec<String> = std::env::args().collect();\n    Command::new("sh").arg("-c").arg(&a[1]).status().unwrap();\n}\n' > rust-project/src/main.rs
          (cd rust-project && cargo generate-lockfile --quiet)
          # Linux has no isolation: a trusted project is read on the host. macOS reads it under its sandbox.
          flags=()
          if [ "$RUNNER_OS" = Linux ]; then flags=(-unsafe-host-exec); fi
          rivus sites -lang rust "${flags[@]}" -C rust-project | grep 'std::process::Command::new'

  # Every `uses:` of the workflows and action.yml is pinned to a full commit SHA with a version comment.
  pinact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read # gh attestation verify

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinact
        run: |
          # renovate: datasource=github-releases depName=suzuki-shunsuke/pinact
          version=v5.0.2
          gh release download -R suzuki-shunsuke/pinact "${version}" -p pinact_linux_amd64.tar.gz
          gh attestation verify pinact_linux_amd64.tar.gz \
            -R suzuki-shunsuke/pinact \
            --signer-workflow suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
          tar xzf pinact_linux_amd64.tar.gz pinact
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run pinact
        run: ./pinact run --check
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # The one check that a ruleset requires. Every job above is in `needs`: it fails when one of them failed or was cancelled, and passes when they
  # passed or were skipped (`test` and `test-rust` are skipped when nothing they read changed). `changes` has to have succeeded: a skip is only a pass when it
  # was decided on an answer.
  ci-ok:
    if: always()
    needs: [changes, shellcheck, ghalint, actionlint, test, test-rust, pinact]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the result of every job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '.changes.result == "success"' > /dev/null
          echo "$NEEDS" | jq -e 'all(.[]; .result != "failure" and .result != "cancelled")' > /dev/null
