name: Setup rivus
description: Build rivus from a release tag and add it to PATH

inputs:
  version:
    description: rivus release tag to build (e.g. v0.0.14), or latest for the newest release
    required: false
    default: latest
  dart:
    description: Also build the Dart extractor (rivus-dart). Requires the Dart SDK on PATH
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Build rivus
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        WITH_DART: ${{ inputs.dart }}
      run: ${{ github.action_path }}/setup.sh
